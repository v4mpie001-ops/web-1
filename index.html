<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Luyện Đề - HTA & PVK</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body>

  <!-- ĐĂNG NHẬP / ĐĂNG KÝ -->
  <div id="auth-screen">
    <div class="auth-box">
      <div class="auth-title">Hệ Thống Luyện Đề</div>
      <div class="auth-tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Đăng Nhập</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Đăng Ký Mới</button>
      </div>
      <div class="input-group">
        <label>Tên đăng nhập</label>
        <input type="text" id="username" placeholder="Nhập tên không dấu...">
      </div>
      <div class="input-group">
        <label>Mật khẩu</label>
        <input type="password" id="password" placeholder="Nhập mật khẩu...">
      </div>
      <div class="input-group" id="admin-code-group" style="display: none;">
        <label>Mã cấp quyền (Admin Code)</label>
        <input type="text" id="adminCode" placeholder="Nhập mã hệ thống cấp...">
      </div>
      <button class="auth-submit" id="btn-auth" onclick="handleAuth()">Đăng Nhập</button>
      <div id="auth-msg"></div>
    </div>
  </div>

  <!-- SẢNH CHỌN MÔN & ĐỀ THI -->
  <div id="dashboard-screen" style="display: none;">
    <header>
      <div class="header-left">HTA & PVK - Sảnh</div>
      <div class="header-right">
        <button onclick="nextTheme()" style="background: #ec4899; color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; margin-left: 10px; font-weight: bold;">
            🎨 Đổi Hình Nền
        </button>
        <button class="btn-add-test" id="btn-add-test" onclick="openUploadModal()" style="display: none;">➕ Thêm Đề Word</button>
        <div class="user-badge" id="dash-username">👤 Guest</div>
        <button class="btn-logout" onclick="logout()">Đăng xuất</button>
      </div>
    </header>
    
    <div class="dashboard-content">
      <h2 class="dash-title" id="dash-main-title">Chọn môn học</h2>
      <div class="subject-grid" id="subject-grid"></div>
      <div id="test-selection" style="display: none;">
        <button class="btn-back" onclick="backToSubjects()">⬅ Quay lại danh sách môn</button>
        <div class="test-list" id="test-list"></div>
      </div>
    </div>
  </div>

  <!-- PHÒNG THI -->
  <div id="app-screen" style="display: none;">
    <header>
      <div class="header-left" id="exam-header-title">Đang làm bài...</div>
      <div class="header-right">
        <div class="timer" id="countdown-timer">00:00</div>
        <button class="btn-submit" id="submit-btn" onclick="submitTest()">Nộp bài</button>
        <button class="btn-logout" onclick="exitExam()">Thoát</button>
      </div>
    </header>

    <div class="main-container">
      <div class="sidebar">
        <div class="sidebar-title">Danh sách câu hỏi</div>
        <div class="question-grid" id="q-grid"></div>
      </div>
      <div class="content-area">
        <div class="quiz-card">
          <div id="score-display"></div>
          
          <div class="q-type-badge" id="q-type-badge">Đang tải...</div>
          <div class="question-text" id="q-title">Đang tải câu hỏi...</div>
          
          <div class="image-box" id="q-image-box">
            <img id="q-image" src="" alt="">
          </div>
          
          <div id="answers-container"></div>
          
          <div class="nav-buttons">
            <button class="btn-nav" id="btn-prev" onclick="changeQuestion(-1)">Quay lại</button>
            <button class="btn-nav" id="btn-next" onclick="changeQuestion(1)">Tiếp theo</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL UPLOAD FILE WORD (Đã fix gộp thành 1) -->
  <div id="upload-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); align-items:center; justify-content:center; z-index:999;">
    <div style="background:white; padding:25px; border-radius:12px; width:450px; max-width:90%;">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <h3 style="margin:0;">Thêm Đề Thi (Hỗ trợ 2 Phần)</h3>
            <button onclick="closeUploadModal()" style="border:none; background:none; font-size:1.5rem; cursor:pointer;">&times;</button>
        </div>
        
        <label style="font-weight:bold;">Môn học:</label>
        <select id="import-subject" style="width:100%; padding:10px; margin-top:5px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px;">
            <option value="toan">Toán</option><option value="ly">Vật Lý</option><option value="tin">Tin Học</option>
        </select>
        
        <label style="font-weight:bold;">Tên đề thi:</label>
        <input type="text" id="import-title" placeholder="VD: Toán THPT Đề 1..." style="width:100%; padding:10px; margin-top:5px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box;">
        
        <label style="font-weight:bold;">Thời gian làm bài (Phút):</label>
        <input type="number" id="import-time" value="45" style="width:100%; padding:10px; margin-top:5px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box;">
        
        <div style="background: #f1f5f9; padding: 10px; border-radius: 8px; border-left: 4px solid #3b82f6; margin-bottom: 10px;">
            <label style="color:#2563eb; font-weight:bold;">1. Tải lên File Trắc nghiệm & Đúng/Sai</label>
            <input type="file" id="import-file-mcq" accept=".docx" style="margin-top:5px;">
        </div>

        <div style="background: #fdf2f8; padding: 10px; border-radius: 8px; border-left: 4px solid #ec4899; margin-bottom: 20px;">
            <label style="color:#db2777; font-weight:bold;">2. Tải lên File Tự Luận (Bỏ trống nếu k có)</label>
            <input type="file" id="import-file-sa" accept=".docx" style="margin-top:5px;">
        </div>
        
        <button onclick="processWordFile()" style="width:100%; padding:12px; background:#3b82f6; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Tiến hành nạp đề</button>
    </div>
  </div>

  <div class="dev-signature">dev by HTA and PVK</div>

  <!-- Thứ tự nạp script rất quan trọng -->
  <script src="database.js"></script>
  <script src="themes.js"></script>
  <script src="script.js"></script>
</body>
</html>
